appId: com.billapp.desktop
productName: BillApp
copyright: Copyright © 2026 BillApp Contributors
asar: true

publish:
  provider: github
  owner: sjzsd147
  repo: BillApp

directories:
  output: ../dist
  buildResources: assets

files:
  - src/**/*
  - assets/**/*
  - package.json

extraResources:
  - from: ../frontend/dist
    to: frontend-dist
  - from: ../build/sidecar/billapp-backend
    to: backend

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 账单助手

portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  icon: assets/icon.png
  category: public.app-category.finance
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip

linux:
  icon: assets/icon.png
  category: Office;Finance;
  maintainer: BillApp Contributors <noreply@github.com>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
