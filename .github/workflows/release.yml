name: Build & Release BillApp

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Install, verify & build frontend
        working-directory: frontend
        run: |
          npm ci
          npx vue-tsc --noEmit
          npx vitest run
          npm run build

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q -p no:cacheprovider

      - name: Install & verify Electron backend manager
        working-directory: electron
        run: |
          npm ci
          npm test

  package:
    name: Package (${{ matrix.artifact_name }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_flags: --win --x64 --skip-smoke
            artifact_name: BillApp-windows-x64
          - os: macos-latest
            build_flags: --mac --arm64 --skip-smoke
            artifact_name: BillApp-macos-arm64
          - os: macos-15-intel
            build_flags: --mac --x64 --skip-smoke
            artifact_name: BillApp-macos-x64
          - os: ubuntu-latest
            build_flags: --linux --x64 --skip-smoke
            artifact_name: BillApp-linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Install build dependencies
        run: |
          pip install -r backend/requirements.txt
          npm --prefix frontend ci
          npm --prefix electron ci

      - name: Sync version from Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm --prefix electron version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build installer (${{ matrix.artifact_name }})
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
        run: node build/build.mjs ${{ matrix.build_flags }}

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/latest*.yml dist/*.blockmap; do
            cp "$f" release-assets/
          done
          ls -lh release-assets/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-assets
          merge-multiple: false

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p final-release
          find downloaded-assets -type f ! -name 'latest-mac.yml' -exec cp {} final-release/ \;
          # Merge arm64 and x64 update manifests so both macOS architectures share latest-mac.yml
          python3 - <<'PY'
          from pathlib import Path
          import re

          mac_files = [
              Path("downloaded-assets/BillApp-macos-arm64/latest-mac.yml"),
              Path("downloaded-assets/BillApp-macos-x64/latest-mac.yml"),
          ]
          existing = [p for p in mac_files if p.is_file()]
          if len(existing) == 1:
              Path("final-release/latest-mac.yml").write_bytes(existing[0].read_bytes())
          elif len(existing) > 1:
              def split_manifest(text: str):
                  lines = text.splitlines()
                  header, file_blocks, footer = [], [], []
                  in_files = False
                  current = []
                  for line in lines:
                      if not in_files and line.strip() == "files:":
                          in_files = True
                          header.append(line)
                          continue
                      if in_files:
                          if line.startswith("  - "):
                              if current:
                                  file_blocks.append(current)
                              current = [line]
                          elif line.startswith("    ") or not line.strip():
                              if current:
                                  current.append(line)
                          else:
                              if current:
                                  file_blocks.append(current)
                                  current = []
                              in_files = False
                              footer.append(line)
                      else:
                          (footer if file_blocks else header).append(line)
                  if current:
                      file_blocks.append(current)
                  return header, file_blocks, footer

              def block_url(block):
                  m = re.search(r"url:\s*(\S+)", "\n".join(block))
                  return m.group(1) if m else ""

              base_header, base_blocks, base_footer = split_manifest(existing[0].read_text(encoding="utf-8"))
              seen = {block_url(b) for b in base_blocks}
              merged_blocks = list(base_blocks)
              for extra in existing[1:]:
                  _, extra_blocks, _ = split_manifest(extra.read_text(encoding="utf-8"))
                  for blk in extra_blocks:
                      u = block_url(blk)
                      if u and u not in seen:
                          seen.add(u)
                          merged_blocks.append(blk)

              # Keep .zip entries first (matches electron-builder updateInfoBuilder ordering)
              merged_blocks.sort(key=lambda b: 0 if block_url(b).endswith(".zip") else 1)
              out_lines = base_header + [ln for blk in merged_blocks for ln in blk] + base_footer
              Path("final-release/latest-mac.yml").write_text("\n".join(out_lines) + "\n", encoding="utf-8")
          PY
          ls -lh final-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: final-release/*
