name: Build & Release BillApp

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Install, verify & build frontend
        working-directory: frontend
        run: |
          npm ci
          npx vue-tsc --noEmit
          npx vitest run
          npm run build

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q -p no:cacheprovider

      - name: Install & verify Electron backend manager
        working-directory: electron
        run: |
          npm ci
          npm test

  package:
    name: Package (${{ matrix.artifact_name }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_flags: --win --x64 --skip-smoke
            artifact_name: BillApp-windows-x64
          - os: macos-latest
            build_flags: --mac --arm64 --skip-smoke
            artifact_name: BillApp-macos-arm64
          - os: macos-15-intel
            build_flags: --mac --x64 --skip-smoke
            artifact_name: BillApp-macos-x64
          - os: ubuntu-latest
            build_flags: --linux --x64 --skip-smoke
            artifact_name: BillApp-linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Install build dependencies
        run: |
          pip install -r backend/requirements.txt
          npm --prefix frontend ci
          npm --prefix electron ci

      - name: Sync version from Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm --prefix electron version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build installer (${{ matrix.artifact_name }})
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: node build/build.mjs ${{ matrix.build_flags }}

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/*.yml dist/*.blockmap; do
            cp "$f" release-assets/
          done
          ls -lh release-assets/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-assets
          merge-multiple: false

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p final-release
          find downloaded-assets -type f ! -name 'latest-mac.yml' -exec cp {} final-release/ \;
          # Preserve arm64 and x64 update manifests without overwrite races
          if [ -f downloaded-assets/BillApp-macos-arm64/latest-mac.yml ]; then
            cp downloaded-assets/BillApp-macos-arm64/latest-mac.yml final-release/latest-mac.yml
          elif [ -f downloaded-assets/BillApp-macos-x64/latest-mac.yml ]; then
            cp downloaded-assets/BillApp-macos-x64/latest-mac.yml final-release/latest-mac.yml
          fi
          ls -lh final-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: final-release/*
